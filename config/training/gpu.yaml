# based on E-Gen paper hyperparameters
optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: "cosine"
  warmup_epochs: 1
  min_lr: 1.0e-6

criterion:
  name: "infonce"
  temperature: 0.1
  reduction: "mean"

training:
  batch_size: 256
  n_epochs: 4
  grad_clip_norm: 1.0
  save_every_n_iters: 25000
  log_every_n_iters: 100
  validate_every_n_iters: 10000
  device: "cuda"
  num_workers: 8

checkpoints:
  dir: "data/models/checkpoints"
  experiment: "${model.name}_${model.version}"
  save_best: true
  save_last: true

visualization:
  use_tensorboard: true
  tensorboard_log_dir: "data/models/runs"
  experiment_name: "${checkpoints.experiment}"
  compute_embedding_quality: false
  embedding_quality_every_n_iters: 1000

dataset:
  train_tsv: "data/ml_training/${model.version}/train.tsv"
  val_tsv: "data/ml_training/${model.version}/val.tsv"
  test_tsv: "data/ml_training/${model.version}/test.tsv"
  max_seq_len: 128
  in_memory: false

evaluation:
  enabled: true
  warmup_iterations: 10000
  tier1_every_n_iters: 5000
  tier2_every_n_iters: 25000
  tier3_every_n_iters: 100000
  n_samples_tier2: 2000
  n_viz_samples: 1000
  topk_queries_path: "data/eval/topk_queries.json"
  analogy_queries_path: "data/eval/analogy_queries.json"
  db_path: "data/integral.db"
  seed: 42
