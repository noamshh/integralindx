optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: "cosine"
  warmup_epochs: 2
  min_lr: 1.0e-6

criterion:
  name: "infonce"
  temperature: 0.1
  reduction: "mean"

training:
  batch_size: 64
  n_epochs: 10
  grad_clip_norm: 1.0
  save_every_n_iters: 5000
  log_every_n_iters: 10
  validate_every_n_iters: 1000
  device: "cpu"
  num_workers: 0

checkpoints:
  dir: "data/models/checkpoints"
  experiment: "${model.name}_${model.version}"
  save_best: true
  save_last: true

visualization:
  use_tensorboard: true
  tensorboard_log_dir: "data/models/runs"
  experiment_name: "${checkpoints.experiment}"
  compute_embedding_quality: false
  embedding_quality_every_n_iters: 500

dataset:
  train_tsv: "data/ml_training/${model.version}/train.tsv"
  val_tsv: "data/ml_training/${model.version}/val.tsv"
  test_tsv: "data/ml_training/${model.version}/test.tsv"
  max_seq_len: 64
  in_memory: true

evaluation:
  enabled: true
  warmup_iterations: 0
  tier1_every_n_iters: 300
  tier2_every_n_iters: 500
  tier3_every_n_iters: 1000
  n_samples_tier2: 500
  n_viz_samples: 200
  eval_queries_path: "data/ml_training/eval_queries.json"
  db_path: "data/integral.db"
  seed: 42
