data:
  synthetic_seeds: "data/ml_seeds/synthetic_seeds.txt"
  integral_db_sample_rate: 0.28
  random_seed: 42
  n_exprs_per_line: 5

egraph:
  # build with: egen_integralind/cargo build --release
  # install with: cp target/release/egen ../bin/egen
  binary_path: "bin/egen"
  n_equivalents: 100
  token_limit: 25
  time_limit: 600

splits:
  train: 0.8
  val: 0.1
  test: 0.1

output:
  base_dir: "data/ml_training"
  version: "v1.0"
  # TSV format: tab-separated values
  # each line: query\tpositive\tneg1\tneg2\tneg3
  # output files:
  # - {base_dir}/{version}/train.tsv
  # - {base_dir}/{version}/val.tsv
  # - {base_dir}/{version}/test.tsv
  # - {base_dir}/{version}/metadata.json

logging:
  level: "INFO"
  file: "data/ml_training/pipeline.log"
  progress_interval: 10

model:
  config_path: "config/model_config.yaml"

optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 0.01   # for L2 regularization
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: "cosine"
  warmup_epochs: 5
  min_lr: 1.0e-6

criterion:
  name: "infonce"
  temperature: 0.1
  reduction: "mean"

training:
  batch_size: 256
  n_epochs: 300
  grad_clip_norm: 1.0
  save_every_n_iters: 1000
  log_every_n_iters: 100
  device: "cuda"  # auto-detected if not available
  num_workers: 4

checkpoints:
  dir: "data/models/checkpoints"
  experiment: "egen_v1"
  save_best: true
  save_last: true

dataset:
  train_tsv: "data/ml_training/v1.0/train.tsv"
  val_tsv: "data/ml_training/v1.0/val.tsv"
  test_tsv: "data/ml_training/v1.0/test.tsv"
  max_seq_len: 128
