data:
  synthetic_seeds: "data/ml_seeds/synthetic_seeds.txt"
  integral_db_sample_rate: 0.2
  random_seed: 42
  n_exprs_per_line: 5  # query + positive + 3 negatives

egraph:
  binary_path: "bin/egen.exe"
  n_equivalents: 100
  token_limit: 12
  time_limit: 300

splits:
  train: 0.8
  val: 0.1
  test: 0.1

output:
  base_dir: "data/ml_training"
  version: "v1.0"

logging:
  level: "INFO"
  file: null
  progress_interval: 10
