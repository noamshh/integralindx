data:
  equivalents_dir: "data/ml_training/equivalents"
  n_exprs_per_line: 5  # query + positive + 3 negatives

splits:
  train: 0.8
  val: 0.1
  test: 0.1
  random_seed: 42

sampling:
  large_cluster_threshold: 200
  max_positives_per_query: 70

output:
  base_dir: "data/ml_training"
  version: "v1.0"

logging:
  level: "INFO"
  file: "${dataset.tsv_construction.output.base_dir}/${dataset.tsv_construction.output.version}/construction_log.log"
  progress_interval: 100
