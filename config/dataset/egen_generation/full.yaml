data:
  frozen_seeds: "data/ml_seeds/frozen_seeds.txt"

egraph:
  binary_path: "bin/egen.exe"
  n_equivalents: 30
  token_limit: 10
  max_token_limit: 10
  time_limit: 400

output:
  equivalents_dir: "data/ml_training/equivalents"
  metadata_file: "equivalents_metadata.json"
  failed_seeds_file: "failed_seeds.json"

processing:
  batch_size: 10
  n_workers: null  # cpu count

logging:
  level: "INFO"
  file: "data/ml_training/equivalents/generation_log.log"
  progress_interval: 10
