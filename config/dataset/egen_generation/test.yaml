data:
  frozen_seeds: "data/ml_seeds/frozen_seeds.txt"

egraph:
  binary_path: "bin/egen.exe"
  n_equivalents: 10
  token_limit: 10
  max_token_limit: 10
  time_limit: 60

output:
  equivalents_dir: "data/ml_training/equivalents_test"
  metadata_file: "equivalents_metadata.json"
  failed_seeds_file: "failed_seeds.json"

processing:
  batch_size: 5
  n_workers: 2

logging:
  level: "INFO"
  file: "data/ml_training/equivalents_test/generation_log.log"
  progress_interval: 1
