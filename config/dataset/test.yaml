data:
  synthetic_seeds: "data/ml_seeds/synthetic_seeds.txt"
  integral_db_sample_rate: 0.0
  random_seed: 42
  n_exprs_per_line: 5

egraph:
  binary_path: "bin/egen.exe"
  n_equivalents: 10
  token_limit: 6
  time_limit: 20

splits:
  train: 0.8
  val: 0.1
  test: 0.1

output:
  base_dir: "data/ml_training"
  version: "test"

logging:
  level: "INFO"
  file: null
  progress_interval: 1
